<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="78%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e3eefc"/>
    </radialGradient>
    <radialGradient id="orb" cx="35%" cy="30%" r="100%">
      <stop offset="0%" stop-color="#8fd0ff"/>
      <stop offset="45%" stop-color="#1e8cff"/>
      <stop offset="100%" stop-color="#0b3fa0"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(30,140,255,0.35)"/>
      <stop offset="60%" stop-color="rgba(30,140,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(30,140,255,0)"/>
    </radialGradient>
    <radialGradient id="shade" cx="50%" cy="90%" r="80%">
      <stop offset="0%" stop-color="rgba(2,18,60,0)"/>
      <stop offset="70%" stop-color="rgba(2,18,60,0.35)"/>
      <stop offset="100%" stop-color="rgba(2,18,60,0.55)"/>
    </radialGradient>
    <clipPath id="orbClip">
      <circle cx="128" cy="128" r="80"/>
    </clipPath>
  </defs>

  <rect width="256" height="256" fill="url(#bg)"/>

  <circle cx="128" cy="128" r="108" fill="url(#orbGlow)"/>

  <circle cx="128" cy="128" r="80" fill="url(#orb)"/>

  <g clip-path="url(#orbClip)">
    <circle cx="128" cy="128" r="80" fill="url(#shade)"/>
    <circle cx="98" cy="96" r="34" fill="rgba(255,255,255,0.14)"/>
  </g>

  <polygon points="90,128 150,96 150,160" fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
</svg>