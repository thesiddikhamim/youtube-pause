<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Mindful Pause — Settings</title>
  <link rel="stylesheet" href="ui.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 56px 20px 80px;
    }

    .page {
      width: 100%;
      max-width: 560px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 38px;
    }
    .orb {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }
    h1.display {
      font-size: 30px;
      letter-spacing: 0.2px;
    }
    .sub {
      font-size: 14px;
      color: var(--text-2);
      margin-top: 6px;
    }

    .section {
      margin-bottom: 34px;
    }
    .section .field-label {
      margin-bottom: 12px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .mode-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 18px 18px 16px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .mode-card:hover {
      border-color: var(--line-strong);
      background: var(--surface-2);
    }
    .mode-card.active {
      border-color: rgba(124, 197, 255, 0.55);
      background: rgba(30, 140, 255, 0.07);
      box-shadow: 0 0 24px rgba(46, 141, 255, 0.14), inset 0 0 0 1px rgba(124, 197, 255, 0.12);
    }
    .mode-card input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .mode-card .name {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 18px;
      font-variation-settings: "opsz" 100, "SOFT" 100;
      color: var(--text);
      margin-bottom: 5px;
    }
    .mode-card .desc {
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text-2);
    }
    .mode-card .check {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid var(--line-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #000;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .mode-card.active .check {
      background: var(--breath);
      border-color: var(--breath);
      opacity: 1;
      box-shadow: 0 0 10px rgba(124, 197, 255, 0.6);
    }

    .note {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-3);
      margin-top: 10px;
    }
    .hidden {
      display: none;
    }

    textarea.field {
      min-height: 140px;
      resize: vertical;
    }

    .save-row {
      display: flex;
      justify-content: center;
      margin-top: 4px;
    }
    .delay-input {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 0 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .delay-input:focus-within {
      border-color: rgba(124, 197, 255, 0.55);
      box-shadow: 0 0 0 3px rgba(46, 141, 255, 0.16);
    }
    .delay-input input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 500;
      padding: 11px 0;
      outline: none;
    }
    .delay-input .unit {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-3);
      padding-left: 10px;
      white-space: nowrap;
    }
    .delay-input input::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }

    .status-wrap {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }

    .history-row {
      margin-top: 38px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="orb" aria-hidden="true"></div>
      <div>
        <h1 class="display">Settings</h1>
        <p class="sub">Choose how the pause works before every video.</p>
      </div>
    </div>

    <div class="section">
      <div class="field-label">Pause mode</div>
      <div class="mode-grid">
        <label class="mode-card" id="mode-timer">
          <input type="radio" name="mode" value="timer" />
          <div class="check">✓</div>
          <div class="name">Timer</div>
          <div class="desc">A breathing circle with a countdown. Wait it out, then decide.</div>
        </label>
        <label class="mode-card" id="mode-journal">
          <input type="radio" name="mode" value="journal" />
          <div class="check">✓</div>
          <div class="name">Journal</div>
          <div class="desc">Write at least 15 words on why this video truly helps you — or admit you're procrastinating.</div>
        </label>
      </div>
    </div>

    <div class="section">
      <label class="field-label" for="message">Pause message</label>
      <textarea class="field" id="message" placeholder="Type your reminder..."></textarea>
    </div>

    <div class="section" id="delayRow">
      <label class="field-label" for="delay">Pause duration</label>
      <div class="delay-input">
        <input id="delay" type="number" min="1" max="60" />
        <span class="unit">SECONDS</span>
      </div>
    </div>

    <p class="note hidden" id="journalNote">In Journal mode, the minimum is always 15 words — you can write more.</p>

    <div class="save-row">
      <button class="btn" id="save">Save changes</button>
    </div>

    <div class="status-wrap">
      <div class="status" id="status">Saved</div>
    </div>

    <div class="history-row">
      <a class="row-link" href="#" id="history">
        <span>Watch history</span>
        <span class="arrow">VIEW →</span>
      </a>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
