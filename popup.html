<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Mindful Pause</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Roboto, "Segoe UI", Arial, sans-serif;
      background: #141926;
      color: #e8eaf0;
      width: 260px;
      padding: 18px 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #5aadff, #1a73e8 70%);
      box-shadow: 0 0 14px rgba(26, 115, 232, 0.6);
      flex-shrink: 0;
    }
    h1 { font-size: 14.5px; color: #fff; line-height: 1.25; }
    .tag { font-size: 11.5px; color: #8a94a6; }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0b0e15;
      border: 1px solid #232b3d;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .switch-row .label { font-size: 13.5px; }
    .switch { position: relative; width: 42px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #2a3350;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }
    .switch input:checked + .slider { background: #1a73e8; }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .link {
      display: block;
      text-align: center;
      background: #0b0e15;
      border: 1px solid #232b3d;
      color: #8a94a6;
      text-decoration: none;
      font-size: 12.5px;
      padding: 9px;
      border-radius: 10px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .link:hover { color: #5aadff; border-color: #1a73e8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"></div>
    <div>
      <h1>Mindful Pause</h1>
      <div class="tag">YouTube</div>
    </div>
  </div>

  <div class="switch-row">
    <span class="label">Pause before videos</span>
    <label class="switch">
      <input type="checkbox" id="toggle" />
      <span class="slider"></span>
    </label>
  </div>

  <a class="link" href="#" id="options">Edit pause message &amp; mode</a>
  <a class="link" href="#" id="history" style="margin-top: 8px;">View watch history</a>

  <script src="popup.js"></script>
</body>
</html>
