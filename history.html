<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch History — YouTube Mindful Pause</title>
  <link rel="stylesheet" href="ui.css" />
  <style>
    body {
      min-height: 100vh;
      padding: 56px 24px 96px;
    }

    .page {
      max-width: 860px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 34px;
    }
    h1.display {
      font-size: 34px;
      letter-spacing: 0.2px;
    }
    .sub {
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--text-3);
      margin-top: 8px;
      letter-spacing: 0.3px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 28px;
      background: var(--surface);
    }
    .stat {
      padding: 18px 20px;
    }
    .stat + .stat {
      border-left: 1px solid var(--line);
    }
    .stat .num {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 28px;
      font-variation-settings: "opsz" 100, "SOFT" 100;
      color: var(--text);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .stat .lbl {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-3);
      margin-top: 6px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .search {
      flex: 1;
      min-width: 200px;
    }
    .segmented .filter-btn {
      flex: 0 1 auto;
    }
    .clear-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid rgba(255, 125, 156, 0.3);
      color: var(--rose);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 12.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .clear-btn:hover {
      background: rgba(255, 125, 156, 0.1);
    }

    .empty {
      text-align: center;
      color: var(--text-3);
      font-size: 14px;
      line-height: 1.7;
      padding: 64px 24px;
      border: 1px dashed var(--line-strong);
      border-radius: 14px;
    }

    .card {
      display: flex;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .card:hover {
      border-color: var(--line-strong);
      background: var(--surface-2);
    }
    .thumb {
      width: 168px;
      height: 94px;
      border-radius: 9px;
      object-fit: cover;
      background: #000;
      border: 1px solid var(--line);
      flex-shrink: 0;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .thumb:hover {
      border-color: rgba(124, 197, 255, 0.4);
    }
    .body {
      flex: 1;
      min-width: 0;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      margin-bottom: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .title:hover {
      color: var(--breath);
    }
    .channel {
      font-size: 12.5px;
      color: var(--text-3);
      margin-bottom: 8px;
    }
    .reason {
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--text-2);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-left: 2px solid rgba(124, 197, 255, 0.5);
      border-radius: 9px;
      padding: 9px 13px;
      margin-top: 6px;
      white-space: pre-wrap;
      max-height: 96px;
      overflow: auto;
    }
    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 9px;
    }
    .badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .badge.timer {
      color: var(--breath);
      background: rgba(30, 140, 255, 0.12);
      border: 1px solid rgba(124, 197, 255, 0.3);
    }
    .badge.journal {
      color: var(--mint);
      background: rgba(92, 224, 160, 0.1);
      border: 1px solid rgba(92, 224, 160, 0.3);
    }
    .badge.flagged {
      color: var(--rose);
      background: rgba(255, 125, 156, 0.1);
      border: 1px solid rgba(255, 125, 156, 0.3);
    }
    .time {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-3);
      margin-left: auto;
    }
    .del {
      align-self: flex-start;
      background: transparent;
      border: none;
      color: var(--text-3);
      font-size: 15px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      line-height: 1;
      transition: color 0.15s ease, background 0.15s ease;
    }
    .del:hover {
      color: var(--rose);
      background: rgba(255, 125, 156, 0.1);
    }

    @media (max-width: 560px) {
      .stats {
        grid-template-columns: 1fr;
      }
      .stat + .stat {
        border-left: none;
        border-top: 1px solid var(--line);
      }
      .thumb {
        width: 120px;
        height: 68px;
      }
      .card {
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <h1 class="display">Watch history</h1>
      <p class="sub">Every video you paused on, with your reasons.</p>
    </div>

    <div class="stats">
      <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">videos paused on</div></div>
      <div class="stat"><div class="num" id="statJournal">0</div><div class="lbl">written reasons</div></div>
      <div class="stat"><div class="num" id="statFlagged">0</div><div class="lbl">flagged unimportant</div></div>
    </div>

    <div class="toolbar">
      <input class="field search" id="search" type="text" placeholder="Search title or reason..." />
      <div class="segmented" id="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="important">Important</button>
        <button class="filter-btn" data-filter="flagged">Unimportant</button>
      </div>
      <button class="clear-btn" id="clearAll">Clear all</button>
    </div>

    <div id="list"></div>
  </div>

  <script src="history.js"></script>
</body>
</html>
